[platformio]
default_envs = w_midi_esp32s3_usb

[env:w_midi_esp32s3_usb]
extends = env:esp32s3_4M_qspi
custom_usermods =
  W_MIDI_USB
build_flags =
  ${env:esp32s3_4M_qspi.build_flags}
  -D USERMOD_W_MIDI_USB
  -D WLED_RELEASE_NAME=\"W-MIDI-USB\"
  -D WLED_MAX_CURRENT=850
  -D DATA_PINS=7
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CONFIG_TINYUSB_ENABLED=1
  -D CONFIG_TINYUSB_MIDI_ENABLED=1
