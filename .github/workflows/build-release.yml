name: Build W-MIDI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows Nuitka
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("v")) {
              $version = "${{ github.ref_name }}".Substring(1)
            } else {
              $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard

      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests
          python -m compileall -q midi_wled_bridge tests

      - name: Build Windows release archive
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/windows/build_release_archive.ps1 -Version "${{ steps.version.outputs.version }}" -PythonExe (Get-Command python).Source

      - name: Upload Windows archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-MIDI-v${{ steps.version.outputs.version }}-Windows
          path: release/W-MIDI-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "release/W-MIDI-v${{ steps.version.outputs.version }}.zip"
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "W-MIDI $tag" --notes "Automated W-MIDI release build."
          }
          gh release upload $tag $zip --clobber

  macos:
    name: macOS Nuitka (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" ]]; then
            if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
              version="${{ github.ref_name }}"
              version="${version#v}"
            else
              version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard imageio

      - name: Run tests
        shell: bash
        run: |
          python -m unittest discover -s tests
          python -m compileall -q midi_wled_bridge tests tools

      - name: Build unsigned macOS release archive
        shell: bash
        run: |
          bash packaging/macos/build_release_archive.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"

      - name: Upload macOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: W-MIDI-v${{ steps.version.outputs.version }}-macOS-${{ matrix.arch }}
          path: release/W-MIDI-v${{ steps.version.outputs.version }}-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          zip="release/W-MIDI-v${{ steps.version.outputs.version }}-macOS-${{ matrix.arch }}.zip"
          gh release view "$tag" || gh release create "$tag" --title "W-MIDI $tag" --notes "Automated W-MIDI release build."
          gh release upload "$tag" "$zip" --clobber
